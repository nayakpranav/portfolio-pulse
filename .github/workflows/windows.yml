name: Windows portable application
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt pyinstaller==6.22.3
      - run: python tools/build_windows.py
      - name: Frozen worker and PDF smoke test
        shell: pwsh
        run: |
          $exe=Resolve-Path 'output/windows/portable/Open FolioLens Personal/Open FolioLens Personal.exe'
          $process=Start-Process -FilePath $exe -ArgumentList '--self-test','smoke.json' -PassThru -Wait -WindowStyle Hidden
          if($process.ExitCode -ne 0){throw 'Portable smoke failed'}
          $result=Get-Content smoke.json | ConvertFrom-Json
          if(-not $result.pdf -or $result.metrics -ne 8 -or -not $result.personal_mode){throw 'Portable result failed'}
          if($result.stock_fund_scope_metrics -ne 8 -or $result.unpriced_derivatives -ne 7 -or -not $result.full_portfolio_partial -or -not $result.scoped_pdf){throw 'Portable partial-scope result failed'}
          if(-not $result.exact_event_persistence -or -not $result.changed_export_recognition){throw 'Portable private evidence persistence failed'}
      - uses: actions/upload-artifact@v4
        with:
          name: FolioLens-Personal-Windows
          path: |
            output/windows/FolioLens-Personal-Windows.zip
            output/windows/SHA256SUMS.txt
            output/windows/package-manifest.json
          retention-days: 30
