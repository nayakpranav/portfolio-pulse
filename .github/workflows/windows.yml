name: Windows portable application
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt pyinstaller==6.22.3
      - run: python tools/build_windows.py
      - name: Frozen worker and PDF/HTML smoke test
        shell: pwsh
        run: |
          $exe=Resolve-Path 'output/windows/portable/Open FolioLens Personal/Open FolioLens Personal.exe'
          $process=Start-Process -FilePath $exe -ArgumentList '--self-test','smoke.json' -PassThru -Wait -WindowStyle Hidden
          if($process.ExitCode -ne 0){throw 'Portable smoke failed'}
          $result=Get-Content smoke.json | ConvertFrom-Json
          if(-not $result.pdf -or $result.metrics -ne 8 -or -not $result.personal_mode){throw 'Portable result failed'}
          if(-not $result.ssl_context_verified -or -not $result.app_chart_import){throw 'Portable TLS/chart startup failed'}
          if(-not $result.html -or -not $result.scoped_html){throw 'Portable HTML exports failed'}
          if($result.stock_fund_scope_metrics -ne 8 -or $result.unpriced_derivatives -ne 7 -or -not $result.full_portfolio_partial -or -not $result.scoped_pdf){throw 'Portable partial-scope result failed'}
          if(-not $result.exact_event_persistence -or -not $result.changed_export_recognition){throw 'Portable private evidence persistence failed'}
          if(-not $result.canonical_drawdown -or -not $result.forward_dividends -or -not $result.offline_chart_toggle){throw 'Portable risk/income reports failed'}
          if(-not $result.noncash_exchange_fifo){throw 'Portable non-cash exchange FIFO failed'}
      - uses: actions/upload-artifact@v4
        with:
          name: FolioLens-Personal-Windows
          path: |
            output/windows/FolioLens-Personal-Windows.zip
            output/windows/SHA256SUMS.txt
            output/windows/package-manifest.json
          retention-days: 30

  publish_v115:
    name: Publish FolioLens Personal v1.0.15
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - name: Check exact version gate
        id: version_gate
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          source = Path("desktop/personal.py").read_text(encoding="utf-8")
          enabled = "VERSION='1.0.15'" in source and Path("docs/RELEASE_v1.0.15.md").is_file()
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"enabled={str(enabled).lower()}\n")
          PY
      - name: Check whether this exact release exists
        if: steps.version_gate.outputs.enabled == 'true'
        id: existing
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view foliolens-personal-v1.0.15 >/dev/null 2>&1; then
            echo 'exists=true' >> "$GITHUB_OUTPUT"
          else
            echo 'exists=false' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        if: steps.version_gate.outputs.enabled == 'true' && steps.existing.outputs.exists == 'false'
        with:
          python-version: '3.12'
      - name: Independently validate production source
        if: steps.version_gate.outputs.enabled == 'true' && steps.existing.outputs.exists == 'false'
        shell: bash
        run: |
          python -m pip install -r requirements-dev.txt -r requirements-validation.txt
          python -m pytest -q
          python tools/validate_returns.py --synthetic
          python tools/privacy_audit.py
      - uses: actions/download-artifact@v4
        if: steps.version_gate.outputs.enabled == 'true' && steps.existing.outputs.exists == 'false'
        with:
          name: FolioLens-Personal-Windows
          path: release
      - name: Verify all portable package files and create release manifest
        if: steps.version_gate.outputs.enabled == 'true' && steps.existing.outputs.exists == 'false'
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json, os, zipfile
          from pathlib import Path
          archive=Path('release/FolioLens-Personal-Windows.zip')
          checksums=Path('release/SHA256SUMS.txt').read_text(encoding='utf-8').strip().split()
          digest=hashlib.sha256(archive.read_bytes()).hexdigest()
          assert checksums == [digest, archive.name], 'Package checksum mismatch'
          manifest=json.loads(Path('release/package-manifest.json').read_text(encoding='utf-8'))
          with zipfile.ZipFile(archive) as z:
              assert z.testzip() is None, 'ZIP CRC failure'
              assert z.namelist(), 'Empty archive'
              expected={'Open FolioLens Personal/'+name for name in manifest}
              actual={name for name in z.namelist() if not name.endswith('/')}
              assert actual == expected, 'ZIP file inventory differs from manifest'
              for name, expected_digest in manifest.items():
                  raw=z.read('Open FolioLens Personal/'+name)
                  assert hashlib.sha256(raw).hexdigest() == expected_digest, f'File hash mismatch: {name}'
          assert len(manifest) >= 1000, 'Unexpectedly small Windows package'
          release_info={
              'name':'FolioLens Personal v1.0.15',
              'tag':'foliolens-personal-v1.0.15',
              'commit':os.environ['GITHUB_SHA'],
              'windows_build_run_id':os.environ['GITHUB_RUN_ID'],
              'package_sha256':digest,
              'verified_file_count':len(manifest),
              'source':'GitHub Actions Windows portable application',
              'private_data_included':False,
          }
          Path('release/release-manifest.json').write_text(json.dumps(release_info,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(release_info,indent=2))
          PY
      - name: Publish exact validated release once
        if: steps.version_gate.outputs.enabled == 'true' && steps.existing.outputs.exists == 'false'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create foliolens-personal-v1.0.15 \
            --target "$GITHUB_SHA" \
            --title "FolioLens Personal v1.0.15" \
            --notes-file docs/RELEASE_v1.0.15.md \
            release/FolioLens-Personal-Windows.zip \
            release/package-manifest.json \
            release/release-manifest.json \
            release/SHA256SUMS.txt
